trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:

- task: Docker@2
  displayName: Build and Push Backend
  inputs:
    containerRegistry: acr-service-connection
    repository: backend-api
    command: buildAndPush
    Dockerfile: applications/backend-api/Dockerfile
    tags: |
      $(Build.BuildId)

- task: Docker@2
  displayName: Build and Push Frontend
  inputs:
    containerRegistry: acr-service-connection
    repository: frontend
    command: buildAndPush
    Dockerfile: applications/frontend/Dockerfile
    tags: |
      $(Build.BuildId)

- task: HelmInstaller@1
  displayName: Install Helm
  inputs:
    helmVersionToInstall: latest

- task: HelmDeploy@0
  displayName: Deploy to AKS
  inputs:
    connectionType: Kubernetes Service Connection
    kubernetesServiceConnection: aks-service-connection
    namespace: default
    command: upgrade
    chartType: FilePath
    chartPath: azure-devops-platform
    releaseName: azure-devops-platform
    arguments: >
      --install
      --set backend.tag=$(Build.BuildId)
      --set frontend.tag=$(Build.BuildId)